services:
  api:
    build: .
    command: uvicorn market_emotion.api:app --host 0.0.0.0 --port 8000
    network_mode: host # 宿主机网络：wigolo MCP (127.0.0.1:3333) 可直接访问
    volumes:
      - ./data:/app/data # 数据库持久化
      - ./models:/models # embedding 模型缓存（避免每次重建下载）
    env_file: .env
    environment:
      - FASTEMBED_CACHE_PATH=/models # fastembed 模型缓存持久化到卷
      - HF_HUB_DISABLE_XET=1 # xet 协议在代理环境失败，回退普通 HTTP
    restart: unless-stopped

  collector:
    build: .
    command: python -m market_emotion.scheduler
    network_mode: host
    volumes:
      - ./data:/app/data
      - ./models:/models
    env_file: .env
    environment:
      - FASTEMBED_CACHE_PATH=/models # fastembed 模型缓存持久化到卷
      - HF_HUB_DISABLE_XET=1 # xet 协议在代理环境失败，回退普通 HTTP
    restart: unless-stopped
    depends_on:
      - api
